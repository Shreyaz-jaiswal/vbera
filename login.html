<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - VibeEra Accessories</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#f5f5f5,#ffffff);
min-height:100vh;
display:flex;
flex-direction:column;
}

header{
background:white;
padding:18px 5%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
font-size:28px;
font-weight:700;
}

header a{
text-decoration:none;
color:#222;
font-weight:600;
}

.container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.login-card{
background:white;
width:100%;
max-width:450px;
padding:35px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.login-card h2{
text-align:center;
margin-bottom:10px;
}

.login-card p{
text-align:center;
color:#666;
margin-bottom:25px;
}

.input-group{
margin-bottom:18px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-weight:600;
}

.input-group input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

.password-box{
position:relative;
}

.password-box button{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
cursor:pointer;
font-size:14px;
color:#555;
}

.login-btn{
width:100%;
padding:12px;
border:none;
background:black;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
margin-top:10px;
}

.login-btn:hover{
opacity:.9;
}

.links{
margin-top:20px;
text-align:center;
}

.links a{
text-decoration:none;
color:#111;
font-weight:600;
}

.demo-box{
margin-top:20px;
padding:12px;
background:#f8f9fa;
border-radius:8px;
font-size:14px;
color:#666;
text-align:center;
}

footer{
background:black;
color:white;
text-align:center;
padding:20px;
}

footer p{
margin:5px 0;
}

@media(max-width:500px){

.login-card{
padding:25px;
}

.logo{
font-size:22px;
}

}
</style>
</head>

<body>

<header>
<div class="logo">VibeEra</div>
<a href="index.html">← Continue Shopping</a>
</header>

<div class="container">

<div class="login-card">

<h2>Welcome Back</h2>

<p>Login to access your VibeEra account</p>

<form id="loginForm">

<div class="input-group">
<label>Email Address</label>
<input
type="email"
id="loginEmail"
placeholder="Enter your email"
required>
</div>

<div class="input-group">
<label>Password</label>

<div class="password-box">

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
required>

<button
type="button"
onclick="togglePassword()"
id="toggleBtn">
Show
</button>

</div>
</div>

<button
type="submit"
class="login-btn">
Login
</button>

</form>

<div class="links">
<p>
Don't have an account?
<a href="register.html">
Register Now
</a>
</p>
</div>

<div class="demo-box">
🛍️ Login to place orders and manage your cart.
</div>

</div>

</div>

<footer>
<p>VibeEra Accessories</p>
<p>📞 +91 8423702403</p>
<p>📍 Dayanand Nagar, Gorakhpur - 273015</p>
<p>© 2026 VibeEra</p>
</footer>

<script>

function togglePassword(){

const passwordField =
document.getElementById("loginPassword");

const toggleBtn =
document.getElementById("toggleBtn");

if(passwordField.type==="password"){

passwordField.type="text";
toggleBtn.innerText="Hide";

}else{

passwordField.type="password";
toggleBtn.innerText="Show";

}

}

document.getElementById(
"loginForm"
).addEventListener(
"submit",
function(e){

e.preventDefault();

const email =
document.getElementById(
"loginEmail"
).value.trim();

const password =
document.getElementById(
"loginPassword"
).value;

const storedUser =
localStorage.getItem(
"vibeera_user_" + email
);

if(!storedUser){

alert(
"No account found with this email."
);

return;
}

const user =
JSON.parse(storedUser);

if(user.password !== password){

alert(
"Incorrect password."
);

return;
}

localStorage.setItem(
"vibeera_loggedin_user",
email
);

alert(
"Welcome back, " +
user.name +
"!"
);

window.location.href =
"index.html";

});

</script>

</body>
</html>
