<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - VibeEra</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f8f9fa;
color:#222;
}

header{
background:white;
padding:18px 5%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
font-size:28px;
font-weight:700;
}

header a{
text-decoration:none;
color:#222;
font-weight:600;
}

.container{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-bottom:25px;
}

h2{
margin-bottom:15px;
}

.cart-item{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 0;
border-bottom:1px solid #eee;
}

.item-info{
display:flex;
flex-direction:column;
}

.item-name{
font-weight:600;
}

.qty-controls{
display:flex;
align-items:center;
gap:8px;
}

.qty-btn{
width:32px;
height:32px;
border:none;
background:black;
color:white;
cursor:pointer;
border-radius:5px;
}

.remove-btn{
background:#dc3545;
color:white;
border:none;
padding:8px 12px;
cursor:pointer;
border-radius:5px;
}

.total{
font-size:24px;
font-weight:bold;
margin-top:15px;
}

input,textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:6px;
}

button{
border:none;
padding:12px 18px;
background:black;
color:white;
cursor:pointer;
border-radius:6px;
}

.payment-box{
background:#fff3cd;
padding:20px;
border-radius:10px;
border:2px solid #ffe08a;
text-align:center;
}

.upi{
font-size:22px;
font-weight:bold;
background:white;
padding:12px;
border-radius:8px;
margin:15px 0;
}

.success{
background:#28a745;
}

.cod{
background:#00b894;
}

.invoice{
display:none;
}

.empty{
text-align:center;
padding:30px;
color:#666;
}

footer{
background:black;
color:white;
text-align:center;
padding:25px;
margin-top:30px;
}

footer p{
margin:6px 0;
}

@media(max-width:700px){

.cart-item{
flex-direction:column;
align-items:flex-start;
gap:10px;
}

}
</style>
</head>

<body>

<header>
<div class="logo">VibeEra</div>
<a href="index.html">← Continue Shopping</a>
</header>

<div class="container">

<!-- CART -->

<div class="card">

<h2>Your Cart</h2>

<div id="cartItems"></div>

<div id="emptyCart" class="empty" style="display:none;">
<h3>Your cart is empty</h3>
<br>
<a href="index.html">Start Shopping</a>
</div>

<div class="total" id="total">
Total: ₹0
</div>

</div>

<!-- BILLING -->

<div class="card" id="billingSection">

<h2>Billing Details</h2>

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="text"
id="phone"
placeholder="Phone Number">

<textarea
id="address"
rows="4"
placeholder="Delivery Address"></textarea>

<button onclick="placeOrder()">
Proceed To Payment
</button>

</div>

<!-- PAYMENT -->

<div class="card" id="paymentSection" style="display:none;">

<h2>Payment</h2>

<div class="payment-box">

<h3>Pay Using UPI</h3>

<div class="upi">
8318463749@fam
</div>

<p>
Amount Payable:
<strong id="payAmount">₹0</strong>
</p>

<br>

<button class="cod"
onclick="contactCOD()">
Cash On Delivery Request
</button>

<br><br>

<button class="success"
onclick="generateInvoice()">
✅ Payment Completed
</button>

</div>

</div>

<!-- INVOICE -->

<div class="card invoice" id="invoiceSection">

<h2>Order Invoice</h2>

<p id="invName"></p>
<p id="invPhone"></p>
<p id="invAddress"></p>

<hr style="margin:15px 0;">

<div id="invItems"></div>

<h3 id="invTotal"></h3>

<br>

<button onclick="window.print()">
Print Invoice
</button>

<button
style="background:#555;"
onclick="location.href='index.html'">
Continue Shopping
</button>

</div>

</div>

<footer>
<p>VibeEra Accessories</p>
<p>📞 +91 8423702403</p>
<p>📍 Dayanand Nagar, Gorakhpur - 273015</p>
<p>© 2026 VibeEra</p>
</footer>

<!-- KEEPING YOUR EMAILJS CODE -->

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

emailjs.init("jO44k4Y07o-bKvnph");

const OWNER_PHONE = "918423702403";

let cart =
JSON.parse(localStorage.getItem("vibeera_cart")) || [];

let customer = {};

function calculateTotal(){

return cart.reduce(
(sum,item)=>
sum + (item.price * item.qty),
0
);

}

function renderCart(){

const cartItems =
document.getElementById("cartItems");

const emptyCart =
document.getElementById("emptyCart");

if(cart.length===0){

cartItems.innerHTML = "";

emptyCart.style.display="block";

document.getElementById("total")
.innerText="Total: ₹0";

return;
}

emptyCart.style.display="none";

cartItems.innerHTML = cart.map((item,index)=>`

<div class="cart-item">

<div class="item-info">
<div class="item-name">${item.name}</div>
<div>₹${item.price}</div>
</div>

<div class="qty-controls">

<button
class="qty-btn"
onclick="changeQty(${index},-1)">
-
</button>

<span>${item.qty || 1}</span>

<button
class="qty-btn"
onclick="changeQty(${index},1)">
+
</button>

<button
class="remove-btn"
onclick="removeItem(${index})">
Remove
</button>

</div>

</div>

`).join("");

document.getElementById("total")
.innerText =
"Total: ₹" + calculateTotal();

}

function changeQty(index,value){

if(!cart[index].qty)
cart[index].qty=1;

cart[index].qty += value;

if(cart[index].qty<1)
cart[index].qty=1;

saveCart();

}

function removeItem(index){

cart.splice(index,1);

saveCart();

}

function saveCart(){

localStorage.setItem(
"vibeera_cart",
JSON.stringify(cart)
);

localStorage.setItem(
"vibeera_total",
calculateTotal()
);

renderCart();

}

function placeOrder(){

if(
!localStorage.getItem(
"vibeera_loggedin_user"
)
){
alert("Please login first.");
location.href="login.html";
return;
}

const name =
document.getElementById("name").value;

const phone =
document.getElementById("phone").value;

const address =
document.getElementById("address").value;

if(!name || !phone || !address){

alert("Please fill all details.");

return;
}

customer = {
name,
phone,
address
};

document.getElementById(
"paymentSection"
).style.display="block";

document.getElementById(
"payAmount"
).innerText =
"₹" + calculateTotal();

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}

function contactCOD(){

window.open(
`https://wa.me/918423702403?text=${encodeURIComponent(
`Hello, I want Cash On Delivery.

Name: ${customer.name || ""}
Phone: ${customer.phone || ""}

Order Amount:
₹${calculateTotal()}`
)}`
);

}

function generateInvoice(){

const orderItems =
cart.map(item =>
`${item.name} x${item.qty} = ₹${item.price * item.qty}`
).join(", ");

emailjs.send(
"service_4hl3ksn",
"template_i04e07g",
{
name:customer.name,
phone:customer.phone,
address:customer.address,
order:orderItems,
total:calculateTotal()
}
);

const whatsappMessage =

`🛍️ NEW ORDER

Customer:
${customer.name}

Phone:
${customer.phone}

Address:
${customer.address}

Items:
${cart.map(
item =>
`• ${item.name}
Qty: ${item.qty}
₹${item.price * item.qty}`
).join('\n\n')}

Total:
₹${calculateTotal()}`;

window.open(
`https://wa.me/${OWNER_PHONE}?text=${encodeURIComponent(whatsappMessage)}`
);

document.getElementById(
"invoiceSection"
).style.display="block";

document.getElementById(
"invName"
).innerText =
"Name: " + customer.name;

document.getElementById(
"invPhone"
).innerText =
"Phone: " + customer.phone;

document.getElementById(
"invAddress"
).innerText =
"Address: " + customer.address;

document.getElementById(
"invItems"
).innerHTML =
cart.map(item => `
<p>
${item.name}
x ${item.qty}
= ₹${item.price * item.qty}
</p>
`).join("");

document.getElementById(
"invTotal"
).innerText =
"Total: ₹" +
calculateTotal();

localStorage.removeItem(
"vibeera_cart"
);

localStorage.removeItem(
"vibeera_total"
);

}

cart = cart.map(item => ({
...item,
qty:item.qty || 1
}));

renderCart();

</script>

</body>
</html>
