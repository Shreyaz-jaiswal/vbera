<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - VibeEra Accessories</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:linear-gradient(135deg,#f5f5f5,#ffffff);
min-height:100vh;
display:flex;
flex-direction:column;
}

header{
background:white;
padding:18px 5%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.logo{
font-size:28px;
font-weight:700;
}

header a{
text-decoration:none;
color:#222;
font-weight:600;
}

.container{
flex:1;
display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.register-card{
background:white;
width:100%;
max-width:500px;
padding:35px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.register-card h2{
text-align:center;
margin-bottom:10px;
}

.register-card p{
text-align:center;
color:#666;
margin-bottom:25px;
}

.input-group{
margin-bottom:16px;
}

.input-group label{
display:block;
margin-bottom:6px;
font-weight:600;
}

.input-group input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

.password-box{
position:relative;
}

.password-box button{
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
background:none;
border:none;
cursor:pointer;
font-size:14px;
color:#555;
}

.register-btn{
width:100%;
padding:12px;
background:black;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

.register-btn:hover{
opacity:.9;
}

.links{
text-align:center;
margin-top:20px;
}

.links a{
text-decoration:none;
font-weight:600;
color:#111;
}

.note{
margin-top:20px;
background:#f8f9fa;
padding:12px;
border-radius:8px;
font-size:14px;
color:#666;
text-align:center;
}

footer{
background:black;
color:white;
text-align:center;
padding:20px;
}

footer p{
margin:5px 0;
}

@media(max-width:500px){

.register-card{
padding:25px;
}

.logo{
font-size:22px;
}

}
</style>
</head>

<body>

<header>
<div class="logo">VibeEra</div>
<a href="index.html">← Continue Shopping</a>
</header>

<div class="container">

<div class="register-card">

<h2>Create Your Account</h2>

<p>Join VibeEra and start shopping today</p>

<form id="registerForm">

<div class="input-group">
<label>Full Name</label>
<input
type="text"
id="regName"
placeholder="Enter your full name"
required>
</div>

<div class="input-group">
<label>Phone Number</label>
<input
type="tel"
id="regPhone"
placeholder="Enter phone number"
required>
</div>

<div class="input-group">
<label>Email Address</label>
<input
type="email"
id="regEmail"
placeholder="Enter email address"
required>
</div>

<div class="input-group">
<label>Password</label>

<div class="password-box">

<input
type="password"
id="regPassword"
placeholder="Create password"
required>

<button
type="button"
onclick="togglePassword('regPassword',this)">
Show
</button>

</div>

</div>

<div class="input-group">
<label>Confirm Password</label>

<div class="password-box">

<input
type="password"
id="confirmPassword"
placeholder="Confirm password"
required>

<button
type="button"
onclick="togglePassword('confirmPassword',this)">
Show
</button>

</div>

</div>

<button
type="submit"
class="register-btn">
Create Account
</button>

</form>

<div class="links">
<p>
Already have an account?
<a href="login.html">
Login Here
</a>
</p>
</div>

<div class="note">
🛍️ Your account is stored securely in your browser for this demo store.
</div>

</div>

</div>

<footer>
<p>VibeEra Accessories</p>
<p>📞 +91 8423702403</p>
<p>📍 Dayanand Nagar, Gorakhpur - 273015</p>
<p>© 2026 VibeEra</p>
</footer>

<script>

function togglePassword(id,btn){

const field =
document.getElementById(id);

if(field.type==="password"){

field.type="text";
btn.innerText="Hide";

}else{

field.type="password";
btn.innerText="Show";

}

}

document.getElementById(
"registerForm"
).addEventListener(
"submit",
function(e){

e.preventDefault();

const name =
document.getElementById(
"regName"
).value.trim();

const phone =
document.getElementById(
"regPhone"
).value.trim();

const email =
document.getElementById(
"regEmail"
).value.trim().toLowerCase();

const password =
document.getElementById(
"regPassword"
).value;

const confirmPassword =
document.getElementById(
"confirmPassword"
).value;

if(password !== confirmPassword){

alert(
"Passwords do not match."
);

return;
}

if(password.length < 6){

alert(
"Password must contain at least 6 characters."
);

return;
}

if(phone.length < 10){

alert(
"Please enter a valid phone number."
);

return;
}

if(
localStorage.getItem(
"vibeera_user_" + email
)
){

alert(
"An account already exists with this email."
);

return;
}

const user = {

name:name,
phone:phone,
email:email,
password:password,
joined:new Date().toLocaleDateString()

};

localStorage.setItem(
"vibeera_user_" + email,
JSON.stringify(user)
);

localStorage.setItem(
"vibeera_loggedin_user",
email
);

alert(
"Account created successfully! Welcome to VibeEra."
);

window.location.href =
"index.html";

});

</script>

</body>
</html>
